<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Book Club">
<title>The Emotional Life of the Toddler: Book Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --sheet:#FFFDF8;
    --ink:#302B27;
    --ink-soft:#63594F;
    --ink-mute:#726860;
    --rule:#E3D8C5;
    --kraft:#D9C7A8;
    --kraft-ink:#54432A;
    --shadow:rgba(48,43,39,.14);
    --c:#C6CFEA;      /* chapter pastel */
    --d:#41508A;      /* chapter deep */
    --accent:#41508A; /* text-safe accent, swaps in dark mode */
    --radius:14px;
    --tap:44px;
  }
  html[data-theme="dark"]{
    --paper:#17150F;
    --sheet:#211E17;
    --ink:#F2EBDD;
    --ink-soft:#C0B6A6;
    --ink-mute:#ABA091;
    --rule:#38312A;
    --kraft:#4B3F2B;
    --kraft-ink:#EBDCC0;
    --shadow:rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){
    html[data-theme="auto"]{
      --paper:#17150F;
      --sheet:#211E17;
      --ink:#F2EBDD;
      --ink-soft:#C0B6A6;
      --ink-mute:#ABA091;
      --rule:#38312A;
      --kraft:#4B3F2B;
      --kraft-ink:#EBDCC0;
      --shadow:rgba(0,0,0,.5);
    }
  }

  *{box-sizing:border-box}
  /* iOS: no grey flash on tap, no text auto-inflation in landscape */
  *{-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  /* kills the 300ms double-tap-to-zoom delay on everything you can touch */
  button,summary,input,textarea,select,a,label,[role="button"]{touch-action:manipulation}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',ui-sans-serif,system-ui,-apple-system,sans-serif;
    font-size:16.5px;
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
    padding-bottom:120px;
  }
  .wrap{max-width:780px;margin:0 auto;padding:0 18px}
  button{font-family:'Karla',sans-serif;color:inherit}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ---------- masthead ---------- */
  .mast{padding-top:26px;padding-bottom:10px}
  .toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .kicker{
    font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;
    font-weight:700;color:var(--ink-mute);margin:0 0 8px
  }
  h1{
    font-family:'Baloo 2',ui-rounded,system-ui,sans-serif;
    font-weight:700;font-size:clamp(29px,7.2vw,42px);line-height:1.08;
    margin:0 0 6px;letter-spacing:-.01em;cursor:pointer;
  }
  h1:hover{color:var(--accent)}
  h1 em{font-style:normal;display:block;color:var(--ink-soft);font-size:.5em;font-weight:600;letter-spacing:0;margin-top:7px}
  .themebtn{
    flex:0 0 auto;min-width:var(--tap);min-height:var(--tap);
    border:1.5px solid var(--rule);background:transparent;border-radius:12px;
    font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-mute);cursor:pointer;padding:0 10px;
  }
  .themebtn:hover{border-color:var(--ink-mute)}

  /* box of crayons progress */
  .box{display:flex;gap:4px;align-items:flex-end;margin:18px 0 5px}
  .box i{flex:1;height:13px;border-radius:3px;border:1.5px solid var(--rule);background:transparent}
  .box i.on{border-color:transparent}
  .boxlabel{font-size:13.5px;color:var(--ink-soft);margin:0}

  /* past the front door the masthead gets out of the way */
  .deep .mast h1{font-size:clamp(19px,4.6vw,24px);margin-bottom:2px}
  .deep .mast h1 em,.deep .boxlabel,.deep .kicker{display:none}
  .deep .mast{padding-bottom:2px}

  /* ---------- crayon rack ---------- */
  .rack{position:sticky;top:0;z-index:30;background:var(--paper);padding:10px 0 8px}
  /* the dock is sticky, so anything we scroll to must stop clear of it */
  .bigq,.anspanel,.byo,#byosec{scroll-margin-top:150px}
  @media(max-width:380px){ .bigq,.anspanel,.byo,#byosec{scroll-margin-top:134px} }
  .rack:after{
    content:"";position:absolute;left:0;right:0;top:100%;height:16px;
    background:linear-gradient(var(--paper),transparent);pointer-events:none;
  }
  /* ---------- the wheel, docked at the top ---------- */
  .dock{
    max-width:780px;margin:0 auto;padding:8px 18px 10px;
    display:flex;align-items:center;gap:14px;
  }
  .dockwheel{position:relative;flex:0 0 auto;width:104px;height:104px}
  .dock .wnum{font-size:21px}
  .dock .hub span{font-size:20px}
  .dockmeta{flex:1;min-width:0}
  .dockkick{
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    color:var(--ink-mute);margin:0 0 1px;
  }
  .dockname{
    display:block;font-family:'Baloo 2',sans-serif;font-weight:600;font-size:17px;
    line-height:1.15;margin-bottom:7px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .dockbtns{display:flex;gap:5px;flex-wrap:wrap}
  /* the two wheel arrows are thumb targets, so give them thumb-sized boxes */
  .pill.step{padding:0 10px;font-size:19px;line-height:1;min-width:42px;min-height:38px}
  .pill{
    border:1.5px solid var(--rule);background:transparent;color:var(--ink-soft);
    border-radius:99px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:700;
    cursor:pointer;min-height:32px;
  }
  .pill.on{border-color:var(--accent);color:var(--accent)}
  .pill.go{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  @media(max-width:380px){
    .dockwheel{width:88px;height:88px}
    .pill{padding:6px 9px;font-size:12px}
  }

  .wheelwrap{position:relative;width:min(340px,86vw);margin:6px auto 0;aspect-ratio:1}
  .wheel{width:100%;height:100%;display:block;touch-action:none;cursor:grab;overflow:visible}
  .wheel:active{cursor:grabbing}
  .wheel:focus-visible{outline:3px solid var(--accent);outline-offset:6px;border-radius:50%}

  .wsec{filter:saturate(.72) brightness(.99);transition:filter .2s ease}
  .wsec.on{filter:saturate(1.1) brightness(1.04)}
  .wnum{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:13px;
    fill:#3A2F20;pointer-events:none;
  }
  .wdone{fill:#3A2F20;opacity:.5;pointer-events:none}
  .whub{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5;pointer-events:none}
  .wnotch{fill:var(--accent)}
  .hub{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;text-align:center;
  }
  .hub span:first-child{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:19px;color:var(--ink);line-height:1;
  }
  .hubhint{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-mute)}
  .wheelhint{
    font-size:14px;color:var(--ink-soft);margin:2px 0 0;line-height:1.5;
  }
  .btn.round{
    width:44px;height:44px;padding:0;border-radius:50%;font-size:22px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }

  .subh{
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:16px;
    margin:20px 0 6px;color:var(--accent);
  }
  .subh:first-child{margin-top:0}
  .btn.go{background:var(--c);border-color:var(--c);color:#22201C;font-size:17px;padding:15px}
  @media(prefers-reduced-motion:reduce){ #wrot{transition:none!important} }

  /* the line that takes the pressure off */
  .slip{
    border:1.5px dashed var(--c);border-radius:12px;
    padding:11px 14px;margin-top:16px;
  }
  .slip p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-soft)}

  /* the finder */
  .find{
    width:100%;box-sizing:border-box;margin-top:10px;padding:12px 14px;
    border:1.5px solid var(--rule);border-radius:11px;background:var(--paper);
    color:var(--ink);font:inherit;font-size:16px;
  }
  .findrow{
    display:flex;gap:11px;align-items:center;width:100%;text-align:left;
    background:transparent;border:0;border-bottom:1px solid var(--rule);
    padding:11px 2px;cursor:pointer;min-height:var(--tap);
  }
  .findrow:last-child{border-bottom:0}
  .fdot{flex:0 0 auto;width:13px;height:13px;border-radius:50%;background:var(--c)}
  .ftxt{flex:1;min-width:0}
  .ftxt b{display:block;font-size:15.5px;font-weight:700;line-height:1.35;color:var(--ink)}
  .ftxt span{display:block;font-size:12.5px;color:var(--ink-mute);margin-top:1px}
  #findlist{max-height:52vh;overflow-y:auto;margin-top:6px}

  /* bring your own */
  .byoform{margin-top:12px}
  .kindpick{display:flex;gap:8px;margin-bottom:10px}
  .kindpick .btn{flex:1;font-size:14.5px}
  .kindpick .btn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#22201C}
  .byoform textarea{min-height:76px}
  .byo{
    display:flex;gap:6px;align-items:flex-start;margin-top:10px;
    border:1.5px solid var(--rule);border-radius:12px;padding:8px 6px 10px 2px;
  }
  .byo.ismine{border-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
  .byo.isquote .byotext{font-style:italic}
  .byobody{flex:1;min-width:0;padding-top:9px}
  .byokind{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
    color:var(--accent);margin:0 0 4px}
  .byotext{margin:0;font-size:16px;line-height:1.5;overflow-wrap:anywhere}
  .byox{flex:0 0 auto;width:var(--tap);height:var(--tap);border:0;background:transparent;color:var(--ink-mute);
    font-size:21px;line-height:1;cursor:pointer;border-radius:9px}
  .byoempty{margin-top:12px}
  .justadded{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.94);opacity:.4}60%{transform:scale(1.02)}100%{transform:scale(1)}}
  .burst{position:absolute;left:50%;top:0;width:0;height:0;pointer-events:none}
  #byosec{position:relative}
  .burst i{
    position:absolute;width:9px;height:9px;border-radius:2px;background:var(--c);
    animation:fly .9s cubic-bezier(.2,.7,.4,1) forwards;
    animation-delay:calc(var(--i) * 22ms);
  }
  @keyframes fly{
    0%{transform:translate(0,0) rotate(0);opacity:1}
    100%{transform:translate(var(--x),-90px) rotate(220deg);opacity:0}
  }
  @media(prefers-reduced-motion:reduce){
    .justadded{animation:none}
    .burst{display:none}
  }

  /* run sheet */
  .flow{list-style:none;margin:16px 0 0;padding:0}
  .flow li{border-bottom:1px solid var(--rule)}
  .flow li:last-child{border-bottom:0}
  .segbtn{
    display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;
    background:transparent;border:0;padding:12px 4px;cursor:pointer;min-height:var(--tap);font-size:15.5px;
  }
  .segbtn .min{flex:0 0 62px;font-weight:700;color:var(--accent);font-size:13.5px;letter-spacing:.03em}
  .segbtn:hover{background:var(--paper)}
  .segbtn[aria-current="true"]{background:var(--c);color:#22201C;border-radius:8px}
  .segbtn[aria-current="true"] .min{color:#22201C}
  .toggle{display:flex;gap:8px;margin-top:16px}
  .toggle .btn{flex:1;font-size:14.5px}
  .toggle .btn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#22201C}
  ol.rules{margin:14px 0 0;padding-left:20px}
  ol.rules li{margin-bottom:10px}

  /* coach marks: the tour points at the real app */
  .coach{position:fixed;inset:0;z-index:90;visibility:hidden}
  .coach.show{visibility:visible}
  .coach .spot{
    position:fixed;border-radius:14px;pointer-events:none;
    border:3px solid var(--c);
    box-shadow:0 0 0 9999px rgba(24,20,14,.66), 0 0 0 6px rgba(255,255,255,.14);
    transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease;
  }
  html[data-theme="dark"] .coach .spot{box-shadow:0 0 0 9999px rgba(0,0,0,.76), 0 0 0 6px rgba(255,255,255,.08)}
  .coacharrow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .coacharrow path{stroke:var(--c);stroke-width:3.2;stroke-linecap:round;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
  .coacharrow polygon{fill:var(--c);filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
  .coach .bubble{
    position:fixed;background:var(--sheet);color:var(--ink);
    border-radius:16px;padding:16px 17px 12px;
    box-shadow:0 14px 40px rgba(0,0,0,.4);
    transition:left .18s ease,top .18s ease;
  }
  .coach .cbar{display:flex;gap:4px;margin-bottom:11px}
  .coach .cbar i{flex:1;height:3px;border-radius:99px;background:var(--rule)}
  .coach .cbar i.on{background:var(--c)}
  .coachx{
    position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;background:transparent;
    color:var(--ink-mute);font-size:24px;line-height:1;cursor:pointer;border-radius:9px;
  }
  .coach .clab{
    font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
    color:var(--accent);margin:0 34px 5px 0;
  }
  .coach .cbig{font-family:'Baloo 2',sans-serif;font-weight:600;font-size:20px;line-height:1.25;margin:0 0 7px}
  .coach .cmed{font-size:14.5px;line-height:1.55;color:var(--ink-soft);margin:0}
  .coach .cfoot{display:flex;gap:8px;align-items:center;margin-top:14px}
  .coach .ccount{flex:1;font-size:12.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  .coach .cfoot .btn{padding:9px 15px;font-size:14px}
  @media(prefers-reduced-motion:reduce){
    .coach .spot,.coach .bubble{transition:none}
  }

  /* timer bar */
  .timer{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--ink);color:var(--paper);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:none;align-items:center;gap:12px;
  }
  .timer.show{display:flex}
  .timer .clock{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:26px;letter-spacing:.02em;min-width:78px;font-variant-numeric:tabular-nums}
  .timer .what{flex:1;font-size:13.5px;line-height:1.35;min-width:0}
  .timer .what b{display:block;font-size:15px}
  .timer button{
    background:transparent;border:1.5px solid rgba(255,255,255,.4);color:var(--paper);
    border-radius:10px;min-width:var(--tap);min-height:var(--tap);cursor:pointer;font-size:13px;font-weight:700;padding:0 10px;
  }
  .timer.over .clock{color:#FFC3AB}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:86px;
    background:var(--ink);color:var(--paper);padding:9px 17px;border-radius:99px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;
  }
  .toast.show{opacity:1}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  footer{text-align:center;color:var(--ink-soft);font-size:13px;padding:6px 0 30px}
  footer a{color:var(--ink-soft)}
  footer .btn{margin-top:14px;font-size:13.5px}

  /* ---------- restored ----------
     These were sitting inside blocks that got cut with the features they
     happened to neighbour. Buttons, ticks, text areas and the pager are all
     still in use. */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    min-height:var(--tap);padding:11px 16px;cursor:pointer;
    background:transparent;border:1.5px solid var(--rule);border-radius:12px;
    font-size:15.5px;font-weight:700;color:var(--ink-soft);
  }
  .btn:hover{border-color:var(--ink-mute);color:var(--ink)}
  .btn.wide{width:100%;margin-top:14px}
  .btn.warn{border-color:#B4553F;color:#B4553F}
  .done[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#22201C}
  .tick{width:21px;height:21px;flex:0 0 auto;border-radius:6px;border:2px solid currentColor;position:relative}
  .done[aria-pressed="true"] .tick{background:var(--sheet);border-color:var(--accent)}
  .done[aria-pressed="true"] .tick:after{
    content:"";position:absolute;left:5px;top:1px;width:6px;height:12px;
    border:solid var(--accent);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)
  }
  .angels{border-left:4px solid var(--c);background:transparent;padding:2px 0 2px 14px;margin-top:16px}
  .angels p{margin:0;font-size:15.5px}
  .permission{font-size:14.5px;color:var(--ink-soft);margin-top:10px;font-style:italic}
  .quiet{border:1.5px dashed var(--c);border-radius:12px;padding:14px 16px;margin-top:16px}
  .quiet p{margin:0;font-size:15.5px}
  .pager{display:flex;gap:10px;margin-top:26px}
  .pager .btn{flex:1;font-size:14.5px;text-align:center;display:block;padding:12px 10px}
  .pager .btn span{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;margin-bottom:2px}
  textarea{
    width:100%;min-height:140px;margin-top:14px;padding:14px;
    background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;
    font-family:'Karla',sans-serif;font-size:16px;line-height:1.6;color:var(--ink);resize:vertical;
  }
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--c)}

  /* ---------- a chapter is a list of sections ---------- */
  .seccount{font-size:14px;color:var(--ink-soft);margin:18px 0 10px;font-weight:700}
  ol.secs{list-style:none;margin:0;padding:0}
  .sec{border:1.5px solid var(--rule);border-radius:12px;margin-bottom:9px;overflow:hidden;
    transition:box-shadow .18s ease}
  .sec.cov{box-shadow:inset 5px 0 0 var(--c)}
  .secgo{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:transparent;border:0;padding:13px 14px;cursor:pointer;min-height:var(--tap);
    font:inherit;color:var(--ink);
  }
  .secgo:hover{background:var(--paper)}
  .secnum{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--c);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;
  }
  .sec.cov .secnum{background:var(--c);color:var(--d)}
  html[data-theme="dark"] .sec.cov .secnum{color:#22201C}
  .sectxt{flex:1;min-width:0}
  .sectxt b{display:block;font-weight:700;font-size:15.5px;line-height:1.4}
  .secmeta{display:block;font-size:12px;color:var(--ink-mute);margin-top:3px;letter-spacing:.03em}
  .mins{
    display:inline-block;font-weight:700;color:var(--accent);
    border:1.4px solid var(--c);border-radius:99px;padding:0 7px;margin-right:7px;font-size:11px;
  }
  .secarrow{
    flex:0 0 auto;width:9px;height:9px;border-right:2.4px solid var(--accent);
    border-top:2.4px solid var(--accent);transform:rotate(45deg);
  }

  /* ---------- the section sheet ---------- */
  .crumb{
    display:inline-flex;align-items:center;gap:6px;background:transparent;
    border:1.5px solid var(--rule);border-radius:99px;padding:6px 13px;
    font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;margin-bottom:14px;
  }
  .crumb:before{content:"\2039";font-size:16px;line-height:1}
  .lead{font-size:17px;line-height:1.6;margin:14px 0 0}
  .watchbox{border-left:4px solid var(--c);padding:3px 0 3px 14px;margin-top:16px}
  .watchbox b{
    display:block;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);margin-bottom:4px;
  }
  .watchbox p{margin:0;font-size:15px;line-height:1.55;color:var(--ink-soft)}
  /* the question is a button now: tap it and it opens to be answered */
  .bigq{
    display:block;width:100%;text-align:left;cursor:pointer;

  .rowbtns .btn{flex:1;text-align:center;display:block}
  .warnbox{border:1.5px solid var(--rule);border-radius:12px;padding:13px 15px;margin-top:14px;font-size:14.5px;color:var(--ink-soft)}

    border:2px solid var(--c);border-radius:16px;padding:26px 20px;margin-top:14px;min-height:190px;
    display:flex;align-items:center;
    font-family:'Baloo 2',sans-serif;font-weight:500;font-size:clamp(20px,5vw,27px);line-height:1.35;
  }
  .queue{border-left:4px solid var(--c);padding:4px 0 4px 14px;margin-top:14px}

<script>

const CH = [
{
  n:1, short:"Early Relationships", color:"Come Back Pink", c:"#F9C5D5", d:"#9C3E59",
  title:"The Emotional Importance of Early Relationships",
  send:"Chapter 1 for our first session. Open the link, tap the question, and leave an answer before we meet. That is the whole prep.",
  opener:"We are starting with the chapter that sets the terms for everything else. Before we get into it: everyone say their name and how far they got.",
  summary:"Toddlers do things that look irrational. Head-banging. Refusing food while hungry. Bolting for the street. Lieberman says none of it is misbehavior. It is a feeling with no words yet. The answer is a secure base: one person reliable enough to leave and come back to.",
  ideas:[
   ["Two feelings at once","Joy and fury run on the same wiring in a brain that cannot yet hold a contradiction."],
   ["The secure base","Closeness is what makes exploration possible. It is not competing with independence, it is funding it."],
   ["The role changes","A parent of an infant regulates. A parent of a toddler negotiates. That is a different job with no training."],
   ["Good enough","Small mismatches that get repaired are the curriculum, not the failure."]
  ],
  contested:"The secure base is presented as universal. Heidi Keller argues that is a Western middle-class picture, and that most families spread care across kin. The steadier position, from Mesman: responsiveness may be widespread, what it looks like is not.",
  warm:[
   {id:"c1w1",q:"Which vignette made you wince with recognition? What did you see yourself doing?"},
   {id:"c1w2",q:"Name one toddler behavior you have privately filed as manipulative. What changes if it is communication instead?"}
  ],
  deep:[
   {id:"c1d1",q:"If defiance is developmentally necessary, what has to be true for an adult to actually believe that mid tantrum, not just agree with it in a book club?"},
   {id:"c1d2",q:"The secure base assumes a caregiver with attention to give. What is competing for that attention in the families you know, and which of those pressures are personal versus structural?"},
   {id:"c1d3",q:"Good enough often gets heard as permission to do less. Where is the line between good enough and neglect, and who gets to decide where it sits for a given family?"},
   {id:"c1d4",q:"Whose child gets read as communicating and whose gets read as bad? What is driving that difference in a classroom, a clinic, a waiting room?"},
   {id:"c1d5",q:"If a family spreads care across grandmothers, aunties, and older siblings, is the secure base missing or is our measure wrong?",note:"This is the Keller critique in one question. Push the room to say what they would actually write in a note about that family."}
  ],
  home:[
   {id:"c1h1",q:"Name one moment this week where you were the secure base without doing anything at all. What made it work?"}
  ],
  angels:"Name one adult who made you feel completely understood when you were very small. Not a whole childhood. One moment.",
  quiet:"Think of a time an adult stayed calm while you fell apart. What did they actually do with their body?",
  between:"Watch for one round trip: a child leaving, exploring, and checking back. Note what the check in looked like, because it is often not eye contact."
},
{
  n:2, short:"Who Is the Toddler?", color:"Second Birth Blue", c:"#C6CFEA", d:"#41508A",
  title:"Who Is the Toddler?",
  send:"Chapter 2 for Tuesday. It is the walking chapter. If you only get through half, get through the walking part.",
  opener:"This whole chapter hangs on walking. Lieberman treats it as a psychological event, not a physical one. Most of what we deal with at two starts there.",
  summary:"Walking changes everything. The child can now leave you on purpose, which is thrilling and terrifying at once. So they cycle: out, back to refuel, out again. The chapter also covers bodies, and the fact that your face teaches them how to feel about theirs.",
  ideas:[
   ["Walking changes the geometry","Distance becomes something the child controls, which is thrilling and frightening at the same time."],
   ["Emotional refueling","The check in is the point of the leaving. A child who never checks back is telling you something."],
   ["Bodies and faces","Your reaction to their curiosity gets stored as a feeling about themselves, long before they have words for it."],
   ["Other minds","The beginning of empathy is a child testing whether you have separate insides."]
  ],
  contested:"Two live arguments. Emotional refueling comes from Mahler, and researchers like Stern and Lyons-Ruth say babies are wired for relatedness from birth. And the brain-development framing has been criticised, by Bruer and Kagan, for turning public problems into private failures.",
  warm:[
   {id:"c2w1",q:"What do you remember being told about your own body as a small child? Not the words necessarily, the tone."},
   {id:"c2w2",q:"Where do you see refueling in the children you work with? What does it look like when it is not eye contact?"}
  ],
  deep:[
   {id:"c2d1",q:"Refueling requires an adult who is findable. What does it look like when the caregiver is physically present but on a phone, or present but dissociated? Is a partial return enough?"},
   {id:"c2d2",q:"If a toddler is testing whether you have your own feelings, they will do the thing that gets a reaction. How do we tell experiment from cruelty at this age, and why do adults reach so fast for the second reading?"},
   {id:"c2d3",q:"Where does brain development language motivate a parent, and where does it frighten them into paralysis?",note:"The sharper version: who benefits when a hard week gets described as damage to a child's architecture? Bruer's argument is that this framing moves a public problem into a private one."},
   {id:"c2d4",q:"Whose bodily curiosity gets treated as normal and whose gets treated as a warning sign? What is that difference actually tracking?"},
   {id:"c2d5",q:"If separateness is not the goal in a family's culture, does this chapter still describe their child?"}
  ],
  home:[
   {id:"c2h1",q:"Pick the bodily thing that most reliably gets a reaction out of you and rehearse a flat, kind response before you need it."}
  ],
  angels:"Who could you find when you were small? Picture the actual room and the actual person. What did finding them feel like in your body?",

  between:"Count how many times in one hour a child looks back at their adult. Notice what the adult does with it."
},
{
  n:3, short:"The Daily Grind", color:"Banana Peeled Wrong", c:"#FBD9A0", d:"#835C10",
  title:"The Challenges of Being (and Raising) a Toddler",
  send:"Chapter 3 for Tuesday. Heads up, this is the hard one. It names the exhaustion and the resentment out loud. Take care of yourself with it.",
  opener:"This is the hard chapter. It says out loud things people do not usually admit about raising a toddler. Bring as much or as little of that as you want.",
  summary:"The hard one. Lieberman names the exhaustion and the resentment without flinching. Then she reframes no: it is a child practicing a will of their own. Your job shifts from protector to partner. Hold the limit and stay warm. That combination teaches that anger does not end love.",
  ideas:[
   ["No is scaffolding","Refusal builds the self. It is not aimed at you, even when it is pointed directly at you."],
   ["The wish to have it all","No capacity yet for mutually exclusive options, so every either or is a loss."],
   ["Tantrum as overflow","Desire outruns language and regulation, and the surplus comes out through the body."],
   ["Hold the limit, hold the child","Firm and warm are not a trade off. Doing only one of them is what fails."]
  ],
  contested:"",
  warm:[
   {id:"c3w1",q:"What is your tell that you are about to lose it? Voice, jaw, breath, speed?"},
   {id:"c3w2",q:"Which everyday limit do you find hardest to hold without getting sharp?"}
  ],
  deep:[
   {id:"c3d1",q:"A dysregulated adult cannot regulate a child. What does the adult owe the child in the moment they cannot do it, and what does the system owe the adult?"},
   {id:"c3d2",q:"Where is the line between socializing a child and breaking their will? Use something from your own week, not a hypothetical."},
   {id:"c3d3",q:"Isolation makes limits harder to hold. What would have to change in a family's actual week, not their mindset, for boundary setting to be sustainable?"},
   {id:"c3d4",q:"Empathy for a tantrum is easier at home than in a store. How much of our practice is shaped by who might be watching, and whose approval are we really managing?"},
   {id:"c3d5",q:"Handing over a phone ends a tantrum in four seconds and it works. What is the honest guidance for a parent who has nothing else left that day?",note:"Nearly half of parents report using screens to manage hard behavior. The 2026 AAP framing puts calm in the middle of it as one of five things to weigh, rather than treating any use as a failure."}
  ],
  home:[
   {id:"c3h1",q:"Pick one recurring battle and remove the choice you were never actually willing to honor."}
  ],
  angels:"Think of one adult who stayed warm with you while holding a line. What did they say? Steal the sentence.",
  quiet:"Finish this sentence out loud: the hardest part of my day with a toddler is usually the moment when...",

},
{
  n:4, short:"Temperament", color:"Nobody Chose This", c:"#C2E5B0", d:"#3C6E35",
  title:"The Question of Temperament",
  send:"Chapter 4 for Tuesday, on temperament. Come thinking about one specific child, not children in general.",
  opener:"Tonight we stop talking about toddlers in general. Hold one specific child in mind. And notice that the parent's temperament was not chosen either.",
  summary:"Temperament is the part nobody chose. How fast a child revs, how much input they can take, how long they need to recover. The tool that matters is goodness of fit: the match between child, caregiver and setting. A mismatch is not a bad child or a bad parent.",
  ideas:[
   ["Temperament is baseline","It is not behavior selected to annoy you, and it does not respond to being argued with."],
   ["Fit belongs to the pair","Goodness of fit is a property of the relationship and the setting, not a property of the child."],
   ["Blame drops out","Once behavior reads as organic, both people stop being the problem."],
   ["Support changes expression","Cautious can mature into thoughtful. Intense can mature into determined. The baseline stays, the shape changes."]
  ],
  contested:"",
  warm:[
   {id:"c4w1",q:"Describe your own temperament as a small child. Who in your family was the best fit for you?"},
   {id:"c4w2",q:"Which temperament is hardest for you to be around now, as an adult?"}
  ],
  deep:[
   {id:"c4d1",q:"Goodness of fit puts the problem in the pair. In real life, who gets asked to change first, and what does that cost the person who is asked?"},
   {id:"c4d2",q:"Ghosts: what did your family punish that you now find hard to tolerate in a child? Name the behavior, not the feeling.",note:"Fraiberg's ghosts in the nursery. Ask this one and then go straight to the angels prompt below. Do not leave the room sitting in the ghost."},
   {id:"c4d3",q:"Temperament language can protect a child or excuse an adult. How would you tell which one is happening in a case you are holding?"},
   {id:"c4d4",q:"Some settings allow almost no range of temperament at all. When the environment is the poor fit, is it still the family's problem to solve?"}
  ],
  home:[
   {id:"c4h1",q:"Name one accommodation you make automatically for an adult you love. Offer the child sized version of it this week."}
  ],
  angels:"Angels: who in your family got your temperament right without being asked? What did they let you do that nobody else did?",
  quiet:"Whose temperament in your family of origin set the weather for everyone else?",
  between:"Write down three words that describe one child's baseline. Then write three that describe yours and look at the gap."
},
{
  n:5, short:"High Activity", color:"Legs Before Brakes", c:"#FFC3AB", d:"#9E4830",
  title:"High-Activity Toddlers: Racing Ahead",
  send:"Chapter 5 for Tuesday. Pick one specific never stops moving child to hold in mind while you read.",
  opener:"This is the child who never stops moving. Pick one real kid who fits, and we will test the chapter against them instead of against a type.",
  summary:"For these kids, movement is thinking. The danger is the gap between legs that can reach the street and a brain that cannot see two seconds ahead. Her answer: change the room, not the child. Secure children explore harder, so the best-anchored one can look the wildest.",
  ideas:[
   ["Movement is cognition","Not a failure to settle. Taking it away removes the child's main way of learning."],
   ["The maturation gap","Physical reach exceeds foresight by years. The gap is the danger, not the child."],
   ["Secure attachment fuels the launch","A well anchored child explores harder, which can read as recklessness."],
   ["Engineer the room","Design the space so the child can be themselves safely, instead of correcting all day."]
  ],
  contested:"",
  warm:[
   {id:"c5w1",q:"How many times a day do you say some version of stop? Guess now, count tomorrow."},
   {id:"c5w2",q:"What does this child look like on a good day? Describe it without using the word behavior."}
  ],
  deep:[
   {id:"c5d1",q:"If a child hears correction all day, what conclusion do they reach about themselves before they have words for it? How would that conclusion show up at seven, at fifteen?"},
   {id:"c5d2",q:"How do you tell joyful high activity from frantic movement driven by fear?",note:"Give the room the three places to look: the quality of the movement, whether the child can settle afterward, and what happens when an adult comes close."},
   {id:"c5d3",q:"Yes spaces assume space, money, and a landlord who allows it. What does environmental engineering look like in one room shared by five people?"},
   {id:"c5d4",q:"High activity children get referred for evaluation earlier and more often, and the referral pattern is not evenly distributed across families. What do we do with that, as the people who write referrals?"}
  ],
  home:[
   {id:"c5h1",q:"Convert one recurring no into a redesign this week. Move the object, not the child."}
  ],
  angels:"Who let you be loud? Who took you outside instead of asking you to settle down?",
  quiet:"What is the most physically exhausting thirty minutes of your week with a child, and what happens in it?",
  between:"Try one hour with the room set up so that nothing needs to be forbidden. Note what you did with the hour instead."
},
{
  n:6, short:"Slow to Warm Up", color:"Edge of the Room", c:"#AEDDEB", d:"#1F6377",
  title:"Slow-to-Warm-Up Toddlers: Taking One's Time",
  send:"Chapter 6 for Tuesday. It is the mirror of last time: same argument, opposite child.",
  opener:"Same argument as last time, opposite child. Watch for the moment she separates caution from anxiety. That one distinction does a lot of work later.",
  summary:"The child at the edge of the room is working, not failing. Watching is how they gather data. Two ways to get it wrong: push and they flood, shield them and tolerance never builds. The middle is one small step at a time.",
  ideas:[
   ["Watching is working","The child at the edge of the room is gathering data, not failing to participate."],
   ["Adult embarrassment drives the push","Most of the time it is the grown up's discomfort that ends the pause, not the child's."],
   ["Scaffolding","An unshakeable base plus small, chosen steps. Both halves are required."],
   ["Two ways to get it wrong","Flooding and shielding both stall development, and they look like opposite virtues."]
  ],
  contested:"American writing treats the outgoing child as default and the cautious one as a case to manage. That is not universal. Plenty of families are deliberately raising a calm, watchful child. Ask whether this family thinks anything is wrong.",
  warm:[
   {id:"c6w1",q:"Whose discomfort usually ends the standing at the edge moment first, the child's or the adult's?"},
   {id:"c6w2",q:"What were you called as a child when you needed time?"}
  ],
  deep:[
   {id:"c6d1",q:"What are the observable signs you have crossed from a nudge into flooding? Name the cues you would trust in a child who has already gone quiet."},
   {id:"c6d2",q:"Shy is a label with a long tail. What does a child do with that word once adults start using it about them in front of them?"},

  home:[

  angels:"Who waited for you? Who did not make you perform for the room?",

  between:"Time it. How long does one child actually need before joining? Most adults guess high or low by a lot."
},
{
  n:7, short:"Early Anxieties", color:"Two AM Violet", c:"#D7C4EA", d:"#5C3E8C",
  title:"Early Anxieties",
  send:"Chapter 7 for Tuesday, on fear. It asks as much about us as about the kids. Passing on any question is always fine.",
  opener:"This chapter is about fear, and it asks as much about us as about the kids. Ghosts come up, and so do angels. Passing is always fine.",
  summary:"Toddler fear has a logic. They can now imagine danger and cannot talk themselves down. A dog, a drain and your angry face all land the same. Lieberman is blunt that a toddler can read your anger as love withdrawn. Play is how they take the controls back.",
  ideas:[
   ["Anticipation without reasoning","A toddler can foresee danger but cannot talk themselves down. The fear arrives with no off switch."],
   ["Discipline can read as abandonment","Unless the repair is explicit and physical, the child may not know the relationship survived."],
   ["Adult states transmit","Buffering a child from your state is possible, and it is not the same as pretending you are fine."],
   ["Mastery through play","Do not sanitize the story. The scary part is the part doing the work."]
  ],
  contested:"Ghosts in the nursery is Fraiberg's. Angels in the nursery is Lieberman's own answer, published in 2005. Angels are specific memories of being loved exactly right, and they appear to buffer against a hard childhood. Skip them and you are teaching half of her.",
  warm:[
   {id:"c7w1",q:"What scary thing did you replay over and over as a child, in a game?"},
   {id:"c7w2",q:"What are the children around you afraid of right now that adults find silly?"}
  ],
  deep:[
   {id:"c7d1",q:"Why do adults interrupt frightening play? Whose anxiety does the interruption serve, and what does the child learn about which feelings are allowed in the room?"},

/* ---- estimated reading time ----
   The reader's locations run about 2.0 per printed page, consistently across
   all eleven chapters. So one location is roughly half a page, call it 125
   words, and 200 words a minute puts a location at about 0.62 minutes. These
   are estimates and the app says so. */
const CH_END={1:74,2:227,3:357,4:479,5:568,6:669,7:795,8:977,9:1094,10:1198,11:1204};
const MIN_PER_LOC=0.62;
CH.forEach(ch=>{
  const secs=ch.sections||[];
  if(!secs.length||ch.extra) return;          /* the screens sheet borrows from elsewhere */
  const end=CH_END[ch.n];
  if(secs.every(x=>x.unlisted)){
    /* no headings, so split the chapter evenly across its beats */
    const per=(end-secs[0].loc)/secs.length;
    secs.forEach(x=>{ x.mins=Math.max(1,Math.round(per*MIN_PER_LOC)); });
  }else{
    secs.forEach((x,i)=>{
      const to = i+1<secs.length ? secs[i+1].loc : end;
      x.mins=Math.max(1,Math.round((to-x.loc)*MIN_PER_LOC));
    });
  }
});
function chMins(ch){ return (ch.sections||[]).reduce((t,x)=>t+(x.mins||0),0); }
function fmtMins(m){
  if(!m) return '';
  if(m<60) return m+' min';
  const h=Math.floor(m/60), r=m%60;
  return r? h+' hr '+r : h+' hr';
}

/* ---- personal state: saved to this browser only, via localStorage ---- */
function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ Object.assign(state,JSON.parse(raw)); return; }
  }catch(e){/* nothing saved yet, or storage unavailable */}
  try{
    const old=localStorage.getItem(OLDKEY);
    if(old){
      const p=JSON.parse(old);
      state.done=p.done||{};
      queueSave();
    }
  }catch(e){/* no old data either */}
}
function ensureState(){
  ['done','notes','covered','byo'].forEach(k=>{ if(!state[k]||typeof state[k]!=='object') state[k]={}; });
  if(!Array.isArray(state.outbox)) state.outbox=[];
  state.outbox=state.outbox.filter(x=>x&&x.item&&x.item.id&&x.qid);
  if(typeof state.name!=='string') state.name='';
  if(![15,25,45].includes(state.flow)) state.flow=25;
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,500);
}
function saveNow(){
  clearTimeout(saveTimer);
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }
  catch(e){ toast('Could not save. Copy your notes out.'); }
}

let shareOK=true;
async function sget(key,fallback){
  try{
    /* belt and braces with the no-store header on the function: iOS is
       enthusiastic about reusing a GET it has already made */
    const r=await fetch(SHARE_API+'?key='+encodeURIComponent(key)+'&t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('status '+r.status);
    const j=await r.json();
    shareOK=true;
    return (j&&j.value)?JSON.parse(j.value):fallback;
  }catch(e){ shareOK=false; return fallback; }
}
async function sset(key,val,quiet){
  try{
    const r=await fetch(SHARE_API+'?key='+encodeURIComponent(key),{
      method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(val)
    });
    if(!r.ok) throw new Error('status '+r.status);
    shareOK=true; return true;
  }catch(e){ shareOK=false; if(!quiet) toast('Could not reach the shared list'); return false; }
}

/* Counted off the clock, not off a tick. iOS throttles or stops timers
   the moment the phone locks, and a session timer that quietly loses
   four minutes in your pocket is worse than no timer. */
let T={segs:null,i:0,left:0,tick:null,running:false,deadline:0,buzzed:false};
function startFlow(segs,i){
  if(!segs||!segs[i]) return;
  T.segs=segs; T.i=i; setSeg(segs[i][2]);
  document.getElementById('timer').classList.add('show');
  paintTimer(); runTick();
  if(current===0) renderHome();
}
function setSeg(secs){
  T.left=secs; T.deadline=Date.now()+secs*1000; T.running=true; T.buzzed=false;
}
function runTick(){
  clearInterval(T.tick);
  T.tick=setInterval(tickNow,250);
}
function tickNow(){
  if(!T.segs||!T.running) return;
  const left=Math.ceil((T.deadline-Date.now())/1000);
  if(left===T.left) return;
  T.left=left;
  if(left<=0 && !T.buzzed){
    T.buzzed=true;
    if(navigator.vibrate) try{navigator.vibrate([120,60,120]);}catch(e){}
  }
  paintTimer();
}
function paintTimer(){
  const bar=document.getElementById('timer');
  const over=T.left<0, s=Math.abs(T.left);
  document.getElementById('clock').textContent=(over?'+':'')+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  bar.classList.toggle('over',over);
  const seg=T.segs[T.i];
  document.getElementById('what').innerHTML='<b>'+esc(seg[0])+'</b><span>'+esc(seg[1])+'</span>';
  document.getElementById('tpause').textContent=T.running?'Pause':'Go';
}
function nextSeg(){
  if(!T.segs) return;
  if(T.i<T.segs.length-1){ T.i++; setSeg(T.segs[T.i][2]); paintTimer(); if(current===0) renderHome(); }
  else stopTimer();
}
function stopTimer(){
  clearInterval(T.tick); T.segs=null; T.running=false; T.tick=null;
  document.getElementById('timer').classList.remove('show');
  if(current===0) renderHome();
}
document.getElementById('tpause').addEventListener('click',()=>{
  if(!T.segs) return;
  if(T.running){ T.running=false; T.left=Math.ceil((T.deadline-Date.now())/1000); }
  else{ T.running=true; T.deadline=Date.now()+T.left*1000; }
  paintTimer();
});
document.getElementById('tnext').addEventListener('click',nextSeg);
document.getElementById('tstop').addEventListener('click',stopTimer);

let SECV=null;   /* the section being worked on, if any */

function goSec(id){
  const hit=findSec(id); if(!hit) return;
  SECV=id; current=hit.ch.n;
  spinTo(CH.indexOf(hit.ch),false);
  render();
  announce(hit.sc.t+', in '+hit.ch.short);
  window.scrollTo({top:0,behavior:'smooth'});
}

function go(n){
  SECV=null;
  current=n;
  const at=CH.findIndex(c=>c.n===n);
  if(at>=0) spinTo(at,false);
  render();
  const ch=CH.find(c=>c.n===n);
  announce(n===0?'Start here':(n===99?'The angels wall':'Chapter '+n+', '+ch.title));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   RENDER: home sheet
   ============================================================ */
/* ============================================================
   THE WHEEL

   Twelve sectors, one per sheet. Drag it round, or tap a sector,
   or use the arrows. Whatever sits under the notch at the top is
   the one you are looking at, and its snapshot renders below.
   ============================================================ */
const DIAL={rot:0, sel:0, drag:null, moved:false};

function dialPoint(a,r){
  const t=(a-90)*Math.PI/180;
  return [(100+r*Math.cos(t)).toFixed(2),(100+r*Math.sin(t)).toFixed(2)];
}
function dialSector(i,r0,r1){
  const A=i*30, a1=A-15, a2=A+15;
  const [x1,y1]=dialPoint(a1,r0), [x2,y2]=dialPoint(a1,r1);
  const [x3,y3]=dialPoint(a2,r1), [x4,y4]=dialPoint(a2,r0);
  return `M ${x1} ${y1} L ${x2} ${y2} A ${r1} ${r1} 0 0 1 ${x3} ${y3} L ${x4} ${y4} A ${r0} ${r0} 0 0 0 ${x1} ${y1} Z`;
}
function dialSelected(){
  return ((Math.round(-DIAL.rot/30)%12)+12)%12;
}
function wheelSVG(){
  let sec='', lab='';
  CH.forEach((ch,i)=>{
    const done=state.done[ch.n];
    sec+='<path class="wsec" data-sec="'+i+'" d="'+dialSector(i,34,92)+'" '+
         'fill="'+ch.c+'" stroke="var(--paper)" stroke-width="1.5"></path>';
    if(done){
      const [dx,dy]=dialPoint(i*30,80);
      lab+='<circle class="wdone" cx="'+dx+'" cy="'+dy+'" r="3.4"></circle>';
    }
    const [tx,ty]=dialPoint(i*30,63);
    lab+='<text class="wnum" x="'+tx+'" y="'+ty+'" data-cx="'+tx+'" data-cy="'+ty+'" '+
         'text-anchor="middle" dominant-baseline="central">'+
         (ch.extra?'\u2605':ch.n)+'</text>';
  });
  return '<svg class="wheel" id="wheel" viewBox="0 0 200 200" tabindex="0" role="slider" '+
    'aria-label="Chapter wheel. Left and right arrows move between chapters and open them. Tap the centre for home." '+
    'aria-valuemin="1" aria-valuemax="12" aria-valuenow="1" aria-valuetext="'+esc(CH[0].title)+'">'+
    '<g id="wrot">'+sec+lab+'</g>'+
    '<circle class="whub" cx="100" cy="100" r="32"></circle>'+
    '<path class="wnotch" d="M100 2 L108 17 L92 17 Z"></path>'+
  '</svg>';
}
let dialTween=null;
function tweenTo(target){
  cancelAnimationFrame(dialTween);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const from=DIAL.rot, delta=target-from;
  if(reduce || Math.abs(delta)<0.02){ DIAL.rot=target; paintDial(); return; }
  const t0=performance.now(), dur=300;
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur);
    DIAL.rot = from + delta*(1-Math.pow(1-p,3));
    paintDial();
    if(p<1) dialTween=requestAnimationFrame(step);
  };
  dialTween=requestAnimationFrame(step);
}
function paintDial(){
  const g=document.getElementById('wrot');
  if(!g) return;
  g.setAttribute('transform','rotate('+DIAL.rot+' 100 100)');
  /* keep the numbers upright while the wheel turns */
  g.querySelectorAll('.wnum').forEach(t=>{
    t.setAttribute('transform','rotate('+(-DIAL.rot)+' '+t.dataset.cx+' '+t.dataset.cy+')');
  });
  const sel=dialSelected();
  DIAL.sel=sel;
  g.querySelectorAll('.wsec').forEach((p,i)=>p.classList.toggle('on',i===sel));
  const ch=CH[sel];
  const hubn=document.getElementById('hubn');
  if(hubn) hubn.textContent = ch.extra?'\u2605':String(ch.n);
  const kick=document.getElementById('dockkick');
  if(kick){
    const t=chMins(ch);
    kick.textContent=(ch.extra?'Extra sheet':'Chapter '+ch.n)+(t?'  \u00b7  '+fmtMins(t):'')+
      (state.done[ch.n]?'  \u00b7  done':'');
  }
  const name=document.getElementById('dockname');
  if(name) name.textContent=ch.short;
  const svg=document.getElementById('wheel');
  if(svg){
    svg.setAttribute('aria-valuenow',sel+1);
    svg.setAttribute('aria-valuetext',ch.title);
  }
}
function spinTo(i,animate){
  const want = -(((i%12)+12)%12)*30;
  /* take the short way round, wherever the wheel happens to be */
  let d=(want-DIAL.rot)%360;
  if(d>180) d-=360; if(d<-180) d+=360;
  if(animate===false){ DIAL.rot=DIAL.rot+d; paintDial(); }
  else tweenTo(DIAL.rot+d);
}
/* turning the wheel is how you get somewhere, not a preview of it: a tap
   on a sector, an arrow-key or arrow-button step, or letting go of a drag
   all land straight on that chapter's page. */
function nudge(d){
  const i=((dialSelected()+d)%12+12)%12;
  go(CH[i].n);
}
function wireDial(){
  const svg=document.getElementById('wheel');
  if(!svg || svg.dataset.wired) return;
  svg.dataset.wired='1';
  const angleAt=e=>{
    const r=svg.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    return Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI;
  };
  /* what sits under a point at a given rotation: a sector index, or the
     centre hub. Angle and radius based, rather than hit-testing the exact
     painted path, so a slightly-off tap on a small dock wheel still lands
     on the sector it looks like it landed on. */
  const partAt=(e,rot)=>{
    const r=svg.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=e.clientX-cx, dy=e.clientY-cy;
    const distUnits=Math.hypot(dx,dy)*(200/r.width);
    if(distUnits<36) return {hub:true};
    const visual=(Math.atan2(dy,dx)*180/Math.PI)+90;
    const a0=(((visual-rot)%360)+360)%360;
    return {hub:false, idx:Math.round(a0/30)%12};
  };
  svg.addEventListener('pointerdown',e=>{
    svg.setPointerCapture(e.pointerId);
    DIAL.drag={a:angleAt(e),rot:DIAL.rot,part:partAt(e,DIAL.rot)};
    DIAL.moved=false;
  });
  svg.addEventListener('pointermove',e=>{
    if(!DIAL.drag) return;
    let d=angleAt(e)-DIAL.drag.a;
    if(d>180) d-=360; if(d<-180) d+=360;
    if(Math.abs(d)>5) DIAL.moved=true;
    DIAL.rot=DIAL.drag.rot+d;
    paintDial();
  });
  const release=()=>{
    if(!DIAL.drag) return;
    const part=DIAL.drag.part, moved=DIAL.moved;
    DIAL.drag=null;
    if(moved){
      const i=((Math.round(-DIAL.rot/30)%12)+12)%12;
      go(CH[i].n);
    }else if(part.hub){
      go(0);
    }else{
      go(CH[part.idx].n);
    }
  };
  svg.addEventListener('pointerup',release);
  svg.addEventListener('pointercancel',()=>{ DIAL.drag=null; });
  svg.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); nudge(1); }
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); nudge(-1); }
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(CH[dialSelected()].n); }
  });
}

    }).slice(0,q?40:80);

/* run the fetches a few at a time: there are 67 sections and firing them
   all at once is a good way to get throttled */
async function pooled(items,size,fn){
  const out=[];
  for(let i=0;i<items.length;i+=size){
    out.push(...await Promise.all(items.slice(i,i+size).map(fn)));
  }
  return out;
}

async function buildExport(){
  const btn=document.getElementById('export');
  if(btn) btn.textContent='Building...';
  const secs=allSections();
  const answers={};
  await pooled(secs,8,async({sc})=>{
    const a=await sget(SK.ans(sc.id),null);
    if(a && typeof a==='object' && !Array.isArray(a)) answers[sc.id]=a;
  });
  if(btn) btn.textContent='Build the export';

  const lines=['THE EMOTIONAL LIFE OF THE TODDLER: book club notes','Exported '+new Date().toLocaleDateString(),''];
  secs.forEach(({ch,sc})=>{
    const note=(state.notes[sc.id]||'').trim();
    const brought=byoOf(sc);
    const cov=!!state.covered[sc.id];
    const ans=answers[sc.id]||{};
    const answered=Object.keys(ans).filter(k=>(ans[k]||[]).length);
    if(!note && !brought.length && !cov && !answered.length) return;
    lines.push('----------------------------------------');
    lines.push(ch.short.toUpperCase()+'  /  '+sc.t+(cov?'  [done]':''));
    if(brought.length){
      lines.push('');
      lines.push('Brought by the group:');
      brought.forEach(b=>lines.push('  - ['+(b.kind==='quote'?'quote':'question')+'] '+b.text));
    }
    if(answered.length){
      const label={}; brought.forEach(b=>label[b.id]=b.text);
      lines.push('');
      lines.push('What the group answered:');
      answered.forEach(id=>{
        lines.push('');
        lines.push('  '+(id===sc.id ? (sc.q||sc.t) : (label[id]||'(since deleted)')));
        (ans[id]||[]).forEach(a=>{
          lines.push('    - '+(a.name||(a.by===state.me?'You':'Someone'))+': '+a.text);
        });
      });
    }
    if(note){ lines.push(''); lines.push('Notes:'); lines.push(note); }
    lines.push('');
  });
  if(lines.length<=3) lines.push('Nothing recorded yet.');
  const text=lines.join('\n');
  const box=document.getElementById('exportbox');
  box.innerHTML='<textarea id="exporttext" readonly aria-label="Exported notes"></textarea>'+
    '<button class="btn wide" id="copyexport">Copy to clipboard</button>';
  document.getElementById('exporttext').value=text;
  document.getElementById('copyexport').addEventListener('click',async()=>{
    try{ await navigator.clipboard.writeText(text); toast('Copied'); }
    catch(e){
      const t=document.getElementById('exporttext'); t.focus(); t.select();
      toast('Select all in the box and copy');
    }
  });
}
