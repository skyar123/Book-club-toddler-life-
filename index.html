   (T.segs
     ? '<button class="btn wide warn" id="stopflow">Stop the clock</button>'
     : '<button class="btn wide go" id="startflow">Start '+state.flow+' minutes</button>')+
   '</section>'+

   '<button class="btn wide done" id="covdone" aria-pressed="'+cov+'"><span class="tick"></span>'+
   (cov?'Done':'Mark this one done')+'</button>'+

   '<div class="pager">'+
     (nb.prev?'<button class="btn" data-sec="'+nb.prev.sc.id+'"><span>Previous</span>'+esc(nb.prev.sc.t)+'</button>'
          :'<button class="btn" data-go="0"><span>Back to</span>Start here</button>')+
     (nb.next?'<button class="btn" data-sec="'+nb.next.sc.id+'"><span>Next</span>'+esc(nb.next.sc.t)+'</button>'
          :'<button class="btn" data-go="0"><span>Back to</span>Start here</button>')+
   '</div>'+
  '</div></div>';

  const ta=document.getElementById('notes');
  ta.value=state.notes[sc.id]||'';
  ta.addEventListener('input',()=>{ state.notes[sc.id]=ta.value; queueSave(); });

  v.querySelectorAll('[data-flow]').forEach(b=>b.addEventListener('click',()=>{
    state.flow=parseInt(b.dataset.flow,10); queueSave(); renderSection(ch,sc);
  }));
  const sf=document.getElementById('startflow');
  if(sf) sf.addEventListener('click',()=>{ startFlow(flowFor(),0); renderSection(ch,sc); });
  const xf=document.getElementById('stopflow');
  if(xf) xf.addEventListener('click',()=>{ stopTimer(); renderSection(ch,sc); });

  const d=document.getElementById('covdone');
  d.addEventListener('click',()=>{
    if(state.covered[sc.id]) delete state.covered[sc.id]; else state.covered[sc.id]=true;
    const on=!!state.covered[sc.id];
    d.setAttribute('aria-pressed',String(on));
    d.lastChild.textContent=on?'Done':'Mark this one done';
    queueSave(); renderBox();
  });

  wireByo(v,sc);
  wireCommon(v);
  loadLive(sc);
}

/* ---- bring your own, per section ---- */
function byoOf(sc){ return (state.byo&&state.byo[sc.id])||[]; }

function byoList(sc){
  const mine=byoOf(sc).filter(b=>b.by===state.me).length;
  return '<section id="byosec"><h3>Bring your own'+squiggle()+'</h3>'+
    '<p class="legend">Your question, or a quote that got you. Everyone on this link sees it.</p>'+
    '<div class="byoform">'+
      '<div class="kindpick" role="group" aria-label="What are you adding">'+
        '<button class="btn" data-kind="q" aria-pressed="true">A question</button>'+
        '<button class="btn" data-kind="quote" aria-pressed="false">A quote</button>'+
      '</div>'+
      '<textarea id="byotext" maxlength="400" aria-label="Your question or quote" placeholder="Type it how you would say it out loud."></textarea>'+
      '<button class="btn wide" id="byoadd">Add it</button>'+
    '</div>'+
    '<div id="byolist">'+byoCards(sc)+'</div>'+
    (mine?'<p class="legend">You have brought '+mine+' to this one.</p>':'')+
  '</section>';
}
function byoCards(sc){
  const items=byoOf(sc);
  if(!items.length) return '<p class="empty byoempty">Nothing brought yet. Yours would be the first.</p>';
  return items.map(b=>{
    const me=b.by===state.me, open=OPEN_ANS.has(b.id);
    return '<div class="byo'+(b.kind==='quote'?' isquote':'')+(me?' ismine':'')+'" id="byo-'+attr(b.id)+'">'+
      '<div class="byobody">'+
        '<p class="byokind">'+(b.kind==='quote'?'Quote':'Question')+(me?' · yours':'')+'</p>'+
        '<p class="byotext">'+esc(b.text)+'</p>'+
        '<button class="ansopen" data-ans="'+attr(b.id)+'" aria-expanded="'+open+'" aria-controls="ans-'+attr(b.id)+'">'+
          '<span class="anstag" id="anstag-'+attr(b.id)+'">'+ansLabel(b.id)+'</span><span class="qchev"></span>'+
        '</button>'+
        '<div class="anspanel" id="ans-'+attr(b.id)+'"'+(open?'':' hidden')+'>'+(open?ansPanel(b.id):'')+'</div>'+
      '</div>'+
      (me?'<button class="byox" data-byox="'+attr(b.id)+'" aria-label="Delete this">&times;</button>':'')+
    '</div>';
  }).join('');
}
function repaintByo(sc,fresh){
  const box=document.getElementById('byolist');
  if(!box) return;
  box.innerHTML=byoCards(sc);
  if(fresh){
    const el=document.getElementById('byo-'+fresh);
    if(el){ el.classList.add('justadded'); el.scrollIntoView({block:'center',behavior:'smooth'}); }
  }
}
function wireByo(v,sc){
  let kind='q';
  v.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{
    kind=b.dataset.kind;
    v.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  }));
  const add=document.getElementById('byoadd');
  if(add) add.addEventListener('click',async()=>{
    const ta=document.getElementById('byotext');
    const text=ta.value.trim();
    if(!text) return toast('Nothing to add yet');
    const item={id:'b'+newId(),kind,text:text.slice(0,400),by:state.me};
    const next=[...byoOf(sc),item];
    if(JSON.stringify(next).length>SHARE_MAX) return toast('This list is full. Delete a few first.');
    state.byo[sc.id]=next;
    ta.value=''; queueSave();
    repaintByo(sc,item.id);
    const shared=await sset(SK.byo(sc.id),state.byo[sc.id],true);
    celebrate(kind,shared);
  });
  /* deleting is handled by the one delegated listener on #view. Bound
     here it would stack a fresh copy on every render, each still
     holding the section it was born in. */
}

/* ---- one listener on the view, wired once at boot ---- */
function wireView(){
  const v=document.getElementById('view');

  v.addEventListener('click',e=>{
    const t=e.target;
    if(!t||!t.closest) return;

    const ans=t.closest('[data-ans]');
    if(ans){ toggleAnswers(ans.dataset.ans); return; }

    const post=t.closest('[data-anspost]');
    if(post){ postAnswer(post.dataset.anspost); return; }

    const refresh=t.closest('[data-ansrefresh]');
    if(refresh){ refreshAnswers(refresh.dataset.ansrefresh); return; }

    const del=t.closest('[data-ansdel]');
    if(del){ armed(del,'Tap again to delete','Delete',()=>delAnswer(del.dataset.ansq,del.dataset.ansdel)); return; }

    const clr=t.closest('[data-ansclear]');
    if(clr){ armed(clr,'Tap again to clear','Clear answers',()=>clearAnswers(clr.dataset.ansclear)); return; }

    const byox=t.closest('[data-byox]');
    if(byox){ deleteByo(byox.dataset.byox); return; }
  });

  /* keep what you typed, so a refresh or a repaint cannot eat it */
  v.addEventListener('input',e=>{
    const t=e.target;
    if(t&&t.dataset&&t.dataset.ansbox!==undefined) ANS_DRAFT[t.dataset.ansbox]=t.value;
  });

  /* the name field is one line, so the return key means post */
  v.addEventListener('keydown',e=>{
    const t=e.target;
    if(!t||!t.dataset||t.dataset.ansname===undefined) return;
    if(e.key!=='Enter') return;
    e.preventDefault();
    postAnswer(t.dataset.ansname);
  });
}

/* two-tap confirm, the pattern the rest of the app already uses */
function armed(btn,warn,back,run){
  if(btn.dataset.armed==='1'){
    btn.dataset.armed='';
    clearTimeout(+btn.dataset.armtimer||0);
    run();
    return;
  }
  btn.dataset.armed='1';
  btn.textContent=warn;
  btn.dataset.armtimer=String(setTimeout(()=>{
    btn.dataset.armed=''; btn.textContent=back;
  },4000));
}

async function deleteByo(id){
  const hit=SECV&&findSec(SECV); if(!hit) return;
  const sc=hit.sc;
  state.byo[sc.id]=byoOf(sc).filter(b=>b.id!==id);
  OPEN_ANS.delete(id);
  delete ANS_DRAFT[id];
  state.outbox=(state.outbox||[]).filter(x=>x.qid!==id);
  queueSave(); repaintByo(sc);
  await sset(SK.byo(sc.id),state.byo[sc.id],true);
  /* take the question's answers with it, or they sit in the blob forever
     with nothing to attach to, eating the size budget */
  if(LIVE.ans && LIVE.ans[id]){
    const latest=await sget(SK.ans(sc.id),null);
    const base=(latest&&typeof latest==='object'&&!Array.isArray(latest))?latest:{};
    const next=mergeAns(base,LIVE.ans);
    delete next[id];
    if(await sset(SK.ans(sc.id),next,true) && SECV===sc.id) LIVE.ans=next;
  }
}

function celebrate(kind,shared){
  toast(!shared ? 'Saved on this phone. The group sees it when you are back online.'
      : kind==='quote' ? 'Quote in. Good one to sit with.'
      : 'Your question is in.');
  const host=document.getElementById('byosec'); if(!host) return;
  const burst=document.createElement('div');
  burst.className='burst';
  burst.innerHTML=Array.from({length:9},(_,i)=>
    '<i style="--i:'+i+';--x:'+(Math.random()*80-40).toFixed(0)+'px"></i>').join('');
  host.appendChild(burst);
  setTimeout(()=>burst.remove(),1200);
  if(navigator.vibrate) try{navigator.vibrate(18);}catch(e){}
}

/* ============================================================
   ANSWERS

   Tap the question, type an answer, everybody on the link reads it.
   One blob per section, keyed by question id, so the section page
   needs exactly one extra fetch. A write merges against whatever is
   on the server first, so two people answering at the same moment
   do not overwrite each other.
   ============================================================ */
const LIVE={ans:{},forSec:null};
const OPEN_ANS=new Set();   /* which panels are open on this screen */
const ANS_DRAFT={};         /* what you have typed but not posted yet */
const ANS_MAX=600;

async function loadLive(sc){
  const [ans,brought]=await Promise.all([
    sget(SK.ans(sc.id),{}),
    sget(SK.byo(sc.id),null)
  ]);
  /* a slow reply for a section you have already left must not land on
     the one you are looking at now */
  if(SECV!==sc.id) return;
  LIVE.ans = (ans&&typeof ans==='object'&&!Array.isArray(ans))?ans:{};
  LIVE.forSec = sc.id;
  if(brought){ state.byo[sc.id]=brought; queueSave(); }
  repaintByo(sc);
  paintAllAnsToggles();
  OPEN_ANS.forEach(id=>paintAnsPanel(id));
}

function ansOf(id){
  const list=(LIVE.ans&&LIVE.ans[id])||[];
  const pend=(state.outbox||[]).filter(x=>x.qid===id&&!list.some(a=>a.id===x.item.id))
                               .map(x=>Object.assign({pending:true},x.item));
  return list.concat(pend);
}
function ansLabel(id){
  const n=ansOf(id).length;
  return n===0 ? 'Answer this' : n===1 ? '1 answer' : n+' answers';
}
function ansName(a){
  if(a.by===state.me) return a.name ? a.name+' (you)' : 'You';
  return a.name || 'Someone';
}
function paintAnsToggle(id){
  const tag=document.getElementById('anstag-'+id);
  if(tag) tag.textContent=ansLabel(id);
}
function paintAllAnsToggles(){
  document.querySelectorAll('#view [data-ans]').forEach(b=>paintAnsToggle(b.dataset.ans));
}
/* union of two answer maps, deduped by answer id, server order first */
function mergeAns(a,b){
  const out={};
  const keys=new Set([].concat(Object.keys(a||{}),Object.keys(b||{})));
  keys.forEach(k=>{
    const seen={}, list=[];
    [].concat((a&&a[k])||[],(b&&b[k])||[]).forEach(x=>{
      if(!x||!x.id||seen[x.id]) return;
      seen[x.id]=1; list.push({id:x.id,by:x.by,name:x.name||'',text:x.text,at:x.at||''});
    });
    if(list.length) out[k]=list;
  });
  return out;
}

function ansPanel(id){
  const list=ansOf(id);
  return '<p class="anshint">'+
      (shareOK
        ? 'Everyone with this link can read what goes in here.'
        : 'The group cannot be reached right now. What you write is kept on this phone and sent when you are back online.')+
    '</p>'+
    (list.length
      ? '<ul class="anslist">'+list.map(a=>
          '<li class="ansitem'+(a.by===state.me?' mine':'')+(a.pending?' anspending':'')+'">'+
            '<p class="ansmeta">'+esc(ansName(a))+(a.at?'  ·  '+esc(a.at):'')+
              (a.pending?'  ·  not sent yet':'')+'</p>'+
            '<p class="anstext">'+esc(a.text)+'</p>'+
            (a.by===state.me?'<button class="ansdel" data-ansdel="'+attr(a.id)+'" data-ansq="'+attr(id)+'">Delete</button>':'')+
          '</li>').join('')+'</ul>'
      : '<p class="empty">No answers yet. Yours would be the first.</p>')+
    '<textarea data-ansbox="'+attr(id)+'" maxlength="'+ANS_MAX+'" aria-label="Your answer" '+
      'placeholder="Answer it how you would say it out loud.">'+esc(ANS_DRAFT[id]||'')+'</textarea>'+
    '<div class="inline">'+
      '<input class="ansname" data-ansname="'+attr(id)+'" maxlength="24" aria-label="Your name, optional" '+
        'placeholder="Your name. Optional." value="'+attr(state.name||'')+'">'+
      '<button class="btn" data-anspost="'+attr(id)+'">Post</button>'+
    '</div>'+
    '<div class="rowbtns">'+
      '<button class="btn" data-ansrefresh="'+attr(id)+'">Refresh</button>'+
      '<button class="btn warn" data-ansclear="'+attr(id)+'">Clear answers</button>'+
    '</div>';
}

/* redraw one panel in place, keeping it open and keeping your draft */
function paintAnsPanel(id){
  const box=document.getElementById('ans-'+id);
  if(!box || box.hidden) return;
  box.innerHTML=ansPanel(id);
  paintAnsToggle(id);
}

function toggleAnswers(id){
  const box=document.getElementById('ans-'+id);
  const btn=document.querySelector('[data-ans="'+cssEsc(id)+'"]');
  if(!box||!btn) return;
  if(OPEN_ANS.has(id)){
    OPEN_ANS.delete(id);
    box.hidden=true; box.innerHTML='';
    btn.setAttribute('aria-expanded','false');
  }else{
    OPEN_ANS.add(id);
    box.innerHTML=ansPanel(id);
    box.hidden=false;
    btn.setAttribute('aria-expanded','true');
    /* only scroll if the question you just tapped is hidden behind the
       sticky dock. otherwise leave the page where the thumb left it. */
    const rack=document.querySelector('.rack');
    const floor=rack?rack.getBoundingClientRect().bottom:0;
    if(btn.getBoundingClientRect().top < floor+8){
      btn.scrollIntoView({block:'start',behavior:'smooth'});
    }
  }
  paintAnsToggle(id);
}

async function postAnswer(id){
  const secId=SECV; if(!secId) return;
  const box=document.querySelector('[data-ansbox="'+cssEsc(id)+'"]');
  const nameIn=document.querySelector('[data-ansname="'+cssEsc(id)+'"]');
  const text=(box?box.value:'').trim();
  if(!text) return toast('Nothing to post yet');
  const name=(nameIn?nameIn.value:'').trim().slice(0,24);
  if(name!==(state.name||'')){ state.name=name; queueSave(); }

  const item={id:'a'+newId(),by:state.me,name:name,text:text.slice(0,ANS_MAX),
              at:new Date().toLocaleDateString()};

  /* pull the latest first so a second answer posted at the same moment survives */
  const latest=await sget(SK.ans(secId),null);
  const base=(latest&&typeof latest==='object'&&!Array.isArray(latest))?latest:{};
  const next=mergeAns(base,LIVE.ans);
  /* anything that never made it out before rides along with this one */
  outboxFor(secId).forEach(x=>{
    const l=next[x.qid]=next[x.qid]||[];
    if(!l.some(a=>a.id===x.item.id)) l.push(x.item);
  });
  (next[id]=next[id]||[]).push(item);

  if(JSON.stringify(next).length>SHARE_MAX){
    return toast('This section’s answers are full. Delete a few first.');
  }

  ANS_DRAFT[id]='';
  if(box) box.value='';
  const ok=await sset(SK.ans(secId),next,true);
  if(ok){
    if(SECV===secId) LIVE.ans=next;
    dropOutbox(secId);
    toast('Posted. Everyone on the link can see it.');
    if(navigator.vibrate) try{navigator.vibrate(14);}catch(e){}
  }else{
    /* keep it, show it, send it with the next post that gets through */
    state.outbox=(state.outbox||[]).concat([{sec:secId,qid:id,item:item}]);
    queueSave();
    toast('Saved on this phone. It goes to the group when you are back online.');
  }
  paintAnsPanel(id);
}

function outboxFor(secId){ return (state.outbox||[]).filter(x=>x.sec===secId); }
function dropOutbox(secId){
  if(!state.outbox||!state.outbox.length) return;
  state.outbox=state.outbox.filter(x=>x.sec!==secId);
  queueSave();
}

async function delAnswer(qid,aid){
  const secId=SECV; if(!secId) return;
  if((state.outbox||[]).some(x=>x.item&&x.item.id===aid)){
    state.outbox=state.outbox.filter(x=>!(x.item&&x.item.id===aid));
    queueSave(); paintAnsPanel(qid); toast('Gone');
    return;
  }
  const latest=await sget(SK.ans(secId),null);
  const base=(latest&&typeof latest==='object'&&!Array.isArray(latest))?latest:{};
  const next=mergeAns(base,LIVE.ans);
  /* only ever your own, whatever the server came back with */
  next[qid]=(next[qid]||[]).filter(a=>!(a.id===aid&&a.by===state.me));
  if(!next[qid].length) delete next[qid];
  const ok=await sset(SK.ans(secId),next,true);
  if(ok){ if(SECV===secId) LIVE.ans=next; toast('Gone'); }
  else toast('Could not reach the group. Try again in a moment.');
  paintAnsPanel(qid);
}

async function refreshAnswers(id){
  const secId=SECV; if(!secId) return;
  const latest=await sget(SK.ans(secId),null);
  if(latest===null && !shareOK){ toast('Cannot reach the group right now'); return; }
  if(SECV!==secId) return;
  LIVE.ans=(latest&&typeof latest==='object'&&!Array.isArray(latest))?latest:{};
  paintAnsPanel(id);
  toast('Refreshed');
}

async function clearAnswers(id){
  const secId=SECV; if(!secId) return;
  const latest=await sget(SK.ans(secId),null);
  const base=(latest&&typeof latest==='object'&&!Array.isArray(latest))?latest:{};
  const next=mergeAns(base,LIVE.ans);
  delete next[id];
  state.outbox=(state.outbox||[]).filter(x=>!(x.sec===secId&&x.qid===id));
  queueSave();
  const ok=await sset(SK.ans(secId),next,true);
  if(ok){ if(SECV===secId) LIVE.ans=next; toast('Answers cleared'); }
  else toast('Could not reach the group. Nothing was cleared.');
  paintAnsPanel(id);
}

/* ============================================================
   THE ANGELS WALL
   ============================================================ */
let WALL={wall:[],at:0};

/* ============================================================
   RENDER: the angels wall

   Nobody moderates this. Whoever writes a line posts it straight to
   the wall, and anyone on the link can take one down, same as anyone
   could rip a page off a real corkboard. No one facilitator, no queue,
   no approval step.
   ============================================================ */
async function renderWall(){
  applyColors({c:'#F6E3B8',d:'#7E5F14'});
  const v=document.getElementById('view');
  v.setAttribute('aria-label','The angels wall');
  v.innerHTML='<div class="sheet"><div class="band"></div><div class="sheet-in">'+
    '<p class="eyebrow">Together</p><h2>The angels wall</h2>'+
    '<p class="colorname">Being loved right, remembered. One line each.</p>'+
    '<p class="legend">Loading...</p></div></div>';
  WALL.wall=await sget(SK.wall,[])||[];
  if(current===99) paintWall();
}

function paintWall(){
  const v=document.getElementById('view');
  const w=WALL.wall, cur=w.length?w[WALL.at%w.length]:null;
  v.innerHTML='<div class="sheet"><div class="band"></div><div class="sheet-in">'+
   '<p class="eyebrow">Together</p>'+
   '<h2>The angels wall</h2>'+
   '<p class="colorname">Being loved right, remembered. One line each.</p>'+

   '<section><h3>What an angel is'+squiggle()+'</h3>'+
   '<ul class="ideas">'+
     '<li><b>Ghosts</b><span>Fraiberg\u2019s word. What was done to you that you now catch yourself repeating.</span></li>'+
     '<li><b>Angels</b><span>Lieberman\u2019s answer, 2005. One specific moment of being loved exactly right when you were small. Not a happy childhood. One moment.</span></li>'+
     '<li><b>Why</b><span>Those memories appear to buffer against a hard childhood. They are part of what stops the cycle.</span></li>'+
     '<li><b>This page</b><span>Where the group\u2019s collect. Add one after a session. Read a few out to open the next one. Anyone can take one down.</span></li>'+
   '</ul>'+
   '<div class="warnbox"><b>Before you write.</b> No names here, but that is not the same as anonymous. This is a small team, and a specific detail will give you away. Write only what you would be fine hearing read out loud. It posts straight to the wall, no approval needed.</div></section>'+

   '<section><h3>The wall'+squiggle()+'</h3>'+
   (cur
    ? '<div class="wallbig">'+esc(cur.text)+'</div>'+
      '<div class="rowbtns"><button class="btn" id="wshuffle">Another one</button><button class="btn" id="wall-all">See all '+w.length+'</button>'+
      '<button class="btn warn" id="walldelcur">Take this down</button></div>'+
      '<div id="walllist"></div>'
    : '<p class="legend">Nothing on the wall yet. It fills up after your first angels prompt.</p>')+
   '</section>'+

   '<section><h3>Add a line'+squiggle()+'</h3>'+
   '<textarea id="wtext" maxlength="280" aria-label="Your angel memory" placeholder="One moment. Where you were, who it was, what they did."></textarea>'+
   '<button class="btn wide" id="wsend">Add it to the wall</button>'+
   '</section>'+

   '<button class="btn wide" id="wrefresh">Refresh the wall</button>'+
  '</div></div>';

  const sh=document.getElementById('wshuffle');
  if(sh) sh.addEventListener('click',()=>{ WALL.at=Math.floor(Math.random()*WALL.wall.length); paintWall(); });
  const all=document.getElementById('wall-all');
  if(all) all.addEventListener('click',()=>{
    document.getElementById('walllist').innerHTML=WALL.wall.map(x=>
      '<div class="wallcard">'+esc(x.text)+
      '<div class="rowbtns"><button class="btn warn" data-walldel="'+x.id+'">Take this down</button></div></div>').join('');
    all.remove();
    wireWallDelete(v);
  });

  const delcur=document.getElementById('walldelcur');
  if(delcur) delcur.addEventListener('click',async()=>{
    if(!cur) return;
    WALL.wall=WALL.wall.filter(x=>x.id!==cur.id);
    await sset(SK.wall,WALL.wall);
    toast('Taken down');
    paintWall();
  });

  document.getElementById('wsend').addEventListener('click',async()=>{
    const t=document.getElementById('wtext').value.trim();
    if(!t) return toast('Nothing to add');
    WALL.wall.push({id:newId(),text:t.slice(0,280),by:state.me});
    await sset(SK.wall,WALL.wall);
    document.getElementById('wtext').value='';
    toast('On the wall');
    paintWall();
  });

  document.getElementById('wrefresh').addEventListener('click',async()=>{
    WALL.wall=await sget(SK.wall,[])||[];
    paintWall(); toast('Refreshed');
  });

  wireWallDelete(v);
}
function wireWallDelete(v){
  v.querySelectorAll('[data-walldel]').forEach(b=>b.addEventListener('click',async()=>{
    WALL.wall=WALL.wall.filter(x=>x.id!==b.dataset.walldel);
    await sset(SK.wall,WALL.wall);
    toast('Taken down');
    paintWall();
  }));
}

/* ============================================================
   TUTORIAL: coach marks over the real app

   Each step points an arrow at a real control, and steps that
   need one navigate the app first, so the tour is a walk through
   the thing itself rather than a slideshow about it.
   ============================================================ */
const TUTORIAL=[
 {lab:"The wheel", big:"Pick a chapter",
  med:"It stays at the top of every screen. Drag it or tap a colour and it takes you straight there. Tap the centre, or the title above it, to come back here.",
  nav:()=>go(0), find:()=>document.getElementById('wheel')},
 {lab:"Then one bit", big:"A section, not a chapter",
  med:"Chapters are long. Sections are not. Each one says how many minutes it is to read. Tap one.",
  nav:()=>go(8), find:()=>document.querySelector('.secs .secgo')},
 {lab:"The question", big:"Tap it. Answer it.",
  med:"Every section has one question. Tap it and it opens: type an answer and everyone on this link can read it, before you meet or during.",
  nav:()=>goSec('c8s3'), find:()=>document.querySelector('.bigq')},
 {lab:"Bring your own", big:"The thing you want to say",
  med:"Your question, or a quote that got you. Everyone on this link sees it.",
  nav:()=>goSec('c8s3'), find:()=>document.getElementById('byosec')},
 {lab:"Angels", big:"What that word means here",
  med:"Fraiberg named the ghosts: what was done to you that you catch yourself repeating. Lieberman\u2019s answer, in 2005, was angels: one memory of being loved exactly right when you were small. Every session ends there.",
  nav:()=>goSec('c8s3'), find:()=>document.querySelector('.angels')},
 {lab:"No order", big:"Or just search",
  med:"Sleep, tantrums, screens, biting. Sixty-seven sections. Pick whatever matches your week.",
  nav:()=>go(0), find:()=>document.getElementById('findbtn')},
 {lab:"Anytime", big:"The tour lives down here",
  med:"Tap Show the tutorial whenever you want it again.",
  nav:()=>go(0), find:()=>document.getElementById('tutorialbtn')}
];

let TUT={i:0,open:false,lastFocus:null,raf:null};

function openTutorial(){
  TUT.i=0; TUT.open=true; TUT.lastFocus=document.activeElement;
  const c=document.getElementById('coach');
  c.classList.add('show'); c.setAttribute('aria-hidden','false');
  paintTutorial();
  document.getElementById('coachnext').focus();
  window.addEventListener('resize',placeCoach);
  window.addEventListener('scroll',placeCoach,{passive:true});
}
function closeTutorial(){
  TUT.open=false;
  const c=document.getElementById('coach');
  c.classList.remove('show'); c.setAttribute('aria-hidden','true');
  window.removeEventListener('resize',placeCoach);
  window.removeEventListener('scroll',placeCoach);
  cancelAnimationFrame(TUT.raf);
  if(!state.tutorialSeen){ state.tutorialSeen=true; saveNow(); }
  if(TUT.lastFocus&&TUT.lastFocus.focus) TUT.lastFocus.focus();
}

function paintTutorial(){
  const c=TUTORIAL[TUT.i], last=TUT.i===TUTORIAL.length-1;
  if(c.nav) c.nav();
  document.getElementById('coachbar').innerHTML=TUTORIAL.map((x,i)=>'<i class="'+(i<=TUT.i?'on':'')+'"></i>').join('');
  document.getElementById('coachlab').textContent=c.lab;
  document.getElementById('coachbig').textContent=c.big;
  document.getElementById('coachmed').textContent=c.med;
  document.getElementById('coachcount').textContent=(TUT.i+1)+' of '+TUTORIAL.length;
  /* not visibility: an explicit visible on a child would out-rank the
     hidden overlay and leave this button floating over the page */
  const back=document.getElementById('coachback');
  back.style.opacity=TUT.i>0?'1':'0';
  back.style.pointerEvents=TUT.i>0?'auto':'none';
  back.disabled=TUT.i===0;
  document.getElementById('coachnext').textContent=last?'Start using it':'Next';

  const el=c.find&&c.find();
  if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
  /* follow the target for a moment while the smooth scroll settles */
  const until=Date.now()+700;
  cancelAnimationFrame(TUT.raf);
  (function follow(){
    placeCoach();
    if(TUT.open && Date.now()<until) TUT.raf=requestAnimationFrame(follow);
  })();
}

function placeCoach(){
  if(!TUT.open) return;
  const step=TUTORIAL[TUT.i];
  const el=step.find&&step.find();
  const spot=document.getElementById('coachspot');
  const bub=document.getElementById('coachbubble');
  const svg=document.getElementById('coacharrow');
  const path=document.getElementById('coachpath');
  const head=document.getElementById('coachhead');
  const W=window.innerWidth, H=window.innerHeight;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);

  if(!el){ /* nothing to point at, centre the bubble and hide the rest */
    spot.style.opacity='0'; path.setAttribute('d',''); head.setAttribute('points','');
    bub.style.left=Math.max(12,(W-Math.min(360,W-24))/2)+'px';
    bub.style.top=Math.max(12,(H-bub.offsetHeight)/2)+'px';
    return;
  }
  spot.style.opacity='1';
  const r=el.getBoundingClientRect();
  const pad=8;
  const sx=Math.max(2,r.left-pad), sy=Math.max(2,r.top-pad);
  const sw=Math.min(W-4,r.width+pad*2);
  /* a target taller than half the screen leaves nowhere for the bubble,
     so highlight the top of it rather than all of it */
  const sh=Math.min(H*0.5,r.height+pad*2);
  spot.style.left=sx+'px'; spot.style.top=sy+'px';
  spot.style.width=sw+'px'; spot.style.height=sh+'px';

  /* bubble goes on whichever side of the target has more room */
  const bw=Math.min(360,W-24);
  bub.style.width=bw+'px';
  const bh=bub.offsetHeight;
  const above=sy, below=H-(sy+sh);
  const gap=58;
  const placeBelow = below>=bh+gap+10 || below>above;
  let by = placeBelow ? sy+sh+gap : sy-bh-gap;
  by=Math.max(10,Math.min(H-bh-10,by));
  let bx=Math.min(Math.max(12,sx+sw/2-bw/2),W-bw-12);
  bub.style.left=bx+'px'; bub.style.top=by+'px';

  /* a hand drawn arrow from the bubble to the edge of the spot */
  const spotCx=sx+sw/2, spotCy=sy+sh/2;
  const bubCx=bx+bw/2;
  const startY = placeBelow ? by-6 : by+bh+6;
  const startX = Math.max(bx+28,Math.min(bx+bw-28,spotCx));
  const endY = placeBelow ? sy+sh+10 : sy-10;
  const endX = Math.max(sx+10,Math.min(sx+sw-10,bubCx));
  const midX=(startX+endX)/2, midY=(startY+endY)/2;
  /* a gentle bow. too much lateral offset on a short vertical run turns the
     curve into a hook and sends the arrowhead sideways */
  const bend=Math.min(30,Math.max(11,Math.hypot(endX-startX,endY-startY)*0.3));
  const cx=midX+(startX<=endX?-bend:bend), cy=midY;
  path.setAttribute('d','M '+startX+' '+startY+' Q '+cx+' '+cy+' '+endX+' '+endY);
  /* arrowhead sits on the tangent at the end of the curve */
  const ang=Math.atan2(endY-cy,endX-cx);
  const a=9.5;
  const p=(t,o)=>[(endX+Math.cos(ang+o)*t).toFixed(1),(endY+Math.sin(ang+o)*t).toFixed(1)].join(',');
  head.setAttribute('points',endX.toFixed(1)+','+endY.toFixed(1)+' '+p(-a*1.6,0.42)+' '+p(-a*1.6,-0.42));
}

document.getElementById('coachx').addEventListener('click',closeTutorial);
document.getElementById('coachback').addEventListener('click',()=>{ if(TUT.i>0){TUT.i--;paintTutorial();} });
document.getElementById('coachnext').addEventListener('click',()=>{
  if(TUT.i===TUTORIAL.length-1) closeTutorial(); else { TUT.i++; paintTutorial(); }
});
document.getElementById('tutorialbtn').addEventListener('click',openTutorial);
document.addEventListener('keydown',e=>{
  if(!TUT.open) return;
  if(e.key==='Escape') closeTutorial();
  if(e.key==='ArrowRight'){ if(TUT.i<TUTORIAL.length-1){TUT.i++;paintTutorial();} else closeTutorial(); }
  if(e.key==='ArrowLeft' && TUT.i>0){ TUT.i--; paintTutorial(); }
});

/* ============================================================
   BOOT
   ============================================================ */
function render(){
  document.body.classList.toggle('deep', !!SECV || current!==0);
  renderBox(); renderDock();
  if(SECV){
    const hit=findSec(SECV);
    if(hit) return renderSection(hit.ch,hit.sc);
    SECV=null;
  }
  if(current===0) renderHome();
  else if(current===99) renderWall();
  else renderChapter(CH.find(c=>c.n===current));
}

const hometitle=document.getElementById('hometitle');
hometitle.addEventListener('click',()=>go(0));
hometitle.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(0); }
});

const themebtn=document.getElementById('themebtn');
function paintTheme(){
  const t=state.theme;
  document.documentElement.setAttribute('data-theme',t);
  themebtn.textContent=t==='auto'?'Auto':(t==='light'?'Day':'Night');
}
themebtn.addEventListener('click',()=>{
  state.theme = state.theme==='auto'?'light':(state.theme==='light'?'dark':'auto');
  paintTheme(); queueSave(); render();
});
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change',()=>{ if(state.theme==='auto') render(); });
}

window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeunload',saveNow);

/* come back to the tab and the group may have answered while you were away */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  tickNow();                       /* catch the clock up after a locked screen */
  const hit=SECV&&findSec(SECV);
  if(hit && LIVE.forSec===SECV) loadLive(hit.sc);
});

(function init(){
  loadState();
  ensureState();
  if(!state.me){ state.me=newId(); queueSave(); }
  wireView();
  paintTheme();
  render();
  if(!state.tutorialSeen) openTutorial();
})();
</script>
